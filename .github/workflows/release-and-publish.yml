name: Release & Publish Packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Package to NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Pixerate' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for pending changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          if [ "$CHANGESETS" -gt "0" ]; then
            echo "Pending changesets found: $CHANGESETS"
          else
            echo "No pending changesets found. Skipping NPM publish."
          fi

      - name: Version packages & update CHANGELOG.md files
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: npx changeset version

      - name: Build package
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: npm run build

      # Commit the version bump BEFORE publishing: `changeset publish` creates the git tag on HEAD,
      # so publishing first tagged the commit before the release (e.g. v1.23.0's package.json said 1.22.0).
      - name: Commit version bumps & changelogs
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: |
          git add .
          git commit -m "chore(release): version packages and update changelogs [skip ci]" || echo "No changes to commit"

      - name: Publish package to NPM using Trusted Publishing (OIDC Provenance)
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Fail loudly: a swallowed push failure would leave npm released but git without the
      # version bump or tag.
      - name: Push release commit & tags
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: git push origin HEAD --follow-tags
