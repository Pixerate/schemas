name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for changeset on PRs
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          if [ "$CHANGESETS" -eq "0" ]; then
            echo "::error title=Missing Changeset::No changeset found in .changeset/. Please run 'npm run changeset' and include the generated markdown file in your PR so packages can be published on merge."
            exit 1
          else
            echo "Pending changeset found: $CHANGESETS"
          fi

      - name: Build package
        run: npm run build

      # `npm ci` and `npm run build` both re-export json-schema/, so compare with what is committed.
      - name: Verify JSON Schema is up to date
        run: |
          if [ -n "$(git status --porcelain -- json-schema)" ]; then
            git status --short -- json-schema
            echo "::error title=Stale JSON Schema::json-schema/ differs from the Zod schemas. Run 'npm run build' and commit json-schema/."
            exit 1
          fi

      - name: Run test suite
        run: npm test

      # Consumers may run zod 4 (zod 3 has no fix for GHSA-mrhx-c7xc-m3w5). Keep the dist built
      # above (JSON Schema export needs zod 3) and run the schemas against zod 4 at runtime.
      - name: Run test suite against zod 4
        run: |
          npm install --no-save --no-audit --no-fund zod@4.6.6
          node --test tests/*.test.mjs

  swift:
    name: Swift Package (Build & Test)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package & export JSON Schema
        run: npm run build

      - name: Verify JSON Schema and generated Swift are up to date
        run: |
          if [ -n "$(git status --porcelain -- json-schema)" ]; then
            echo "::error title=Stale JSON Schema::json-schema/ differs from the Zod schemas. Run 'npm run build' and commit json-schema/."
            exit 1
          fi
          npm run gen:swift -- --check

      - name: Build Swift package
        run: swift build

      - name: Test Swift package
        run: swift test
