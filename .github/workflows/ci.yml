name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for changeset on PRs
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          if [ "$CHANGESETS" -eq "0" ]; then
            echo "::error title=Missing Changeset::No changeset found in .changeset/. Please run 'npm run changeset' and include the generated markdown file in your PR so packages can be published on merge."
            exit 1
          else
            echo "Pending changeset found: $CHANGESETS"
          fi

      - name: Build package
        run: npm run build

      - name: Verify JSON Schema is up to date
        run: npm run export:json-schema -- --check

      - name: Run test suite
        run: npm test

  swift:
    name: Swift Package (Build & Test)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package & export JSON Schema
        run: npm run build

      - name: Verify generated Swift is up to date
        run: npm run gen:swift -- --check

      - name: Build Swift package
        run: swift build

      - name: Test Swift package
        run: swift test
